name: build-kernel
on:
  push:
    branches: [ "tw10-android-4.9-q-stock", "resukisu-star2lte" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison flex libssl-dev libncurses-dev build-essential \
            libelf-dev zip git ca-certificates wget python3 kmod cpio rsync

      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Fetch GCC 4.9 toolchains (Google prebuilts)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Build kernel
        run: |
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"
          export KBUILD_BUILD_USER=ci
          export KBUILD_BUILD_HOST=resukisu
          make exynos9810-star2lte_defconfig
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: List build output
        if: always()
        run: ls -la arch/arm64/boot/ 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-bare
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image.gz-dtb
            build.log
          if-no-files-found: warn
